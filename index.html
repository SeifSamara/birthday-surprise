<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 💖</title>

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
    text-align:center;
}

/* العد التنازلي */
#countdown {
    font-size:50px;
}

/* المحتوى المخفي */
#content {
    display:none;
    animation:fadeIn 2s;
}

img {
    width:250px;
    border-radius:20px;
    margin:20px auto;
    display:block;
}

button {
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}
</style>
</head>

<body>

<h1 id="countdown">Loading...</h1>

<div id="content">
    <h1>🎉 Happy Birthday ya manonty 🎉</h1>
    <img src=IMG-20251201-WA0017.jpg">

    <p>💖 You are the best thing in my life 💖</p>

    <button onclick="playMusic()">💖 Play Music 🎶</button>
</div>

<iframe id="musicFrame" width="0" height="0" frameborder="0"></iframe>

<script>
// ⏳ عد تنازلي لحد 12
function updateCountdown() {
    const now = new Date();
    const target = new Date();
    target.setHours(24,0,0,0); // الساعة 12 بالليل

    const diff = target - now;

    const h = Math.floor(diff / (1000*60*60));
    const m = Math.floor((diff % (1000*60*60)) / (1000*60));
    const s = Math.floor((diff % (1000*60)) / 1000);

    document.getElementById("countdown").innerHTML =
        `${h}:${m}:${s}`;

    if(diff <= 0){
        document.getElementById("countdown").style.display="none";
        document.getElementById("content").style.display="block";
    }
}

setInterval(updateCountdown,1000);

// 🎶 تشغيل الأغنية
function playMusic(){
    document.getElementById("musicFrame").src =
    "https://www.youtube.com/embed/4k4YHc8cKjE?autoplay=1&loop=1&playlist=4k4YHc8cKjE";
}
</script>

</body>
</html>
