<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حبيبتي ملاك - Happy Birthday 💖</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: 'Tajawal', 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #2b1b3a, #1a1a2e, #16213e);
        background-attachment: fixed;
        color: white;
        text-align: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* خلفية الكونفيتي المتحركة */
    .confetti-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
    }

    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #f0f;
        top: -20px;
        animation: fall linear infinite;
    }

    @keyframes fall {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(100vh) rotate(360deg);
            opacity: 0.3;
        }
    }

    /* القلوب الطايرة */
    .floating-hearts {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
    }

    .heart {
        position: absolute;
        bottom: -50px;
        font-size: 25px;
        animation: floatUp linear infinite;
        opacity: 0.7;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0.8;
        }
        100% {
            transform: translateY(-100vh) rotate(360deg);
            opacity: 0;
        }
    }

    /* صندوق العد التنازلي */
    .countdown-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 70px;
        padding: 50px 60px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(255, 255, 255, 0.2) inset;
        z-index: 2;
        text-align: center;
        border: 1px solid rgba(255,255,200,0.3);
    }

    #countdown {
        font-size: 110px;
        font-weight: bold;
        font-family: monospace;
        background: linear-gradient(45deg, #FFD700, #FFA500, #FF69B4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 8px;
        text-shadow: 0 0 20px rgba(255,215,0,0.5);
    }

    .countdown-label {
        font-size: 24px;
        margin-top: 15px;
        font-weight: 500;
        color: #FFE4B5;
    }

    .wait-message {
        font-size: 18px;
        margin-top: 20px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 20px;
        border-radius: 50px;
        display: inline-block;
    }

    /* المحتوى اللي بيظهر بعد العداد */
    #content {
        display: none;
        z-index: 2;
        max-width: 550px;
        width: 90%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(20px);
        border-radius: 60px;
        padding: 45px 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,200,0.3);
        animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    img {
        width: 220px;
        border-radius: 50%;
        border: 4px solid #FFD700;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        margin: 15px auto;
        display: block;
    }

    h2 {
        font-size: 32px;
        margin: 15px 0;
        color: #FFD700;
        text-shadow: 0 0 10px #ff69b4;
    }

    .special-message {
        background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,105,180,0.2));
        border-radius: 40px;
        padding: 25px 20px;
        margin: 20px 0;
        border: 1px solid rgba(255,215,0,0.5);
        text-align: center;
    }

    .special-message p {
        font-size: 22px;
        line-height: 1.6;
        color: #fff5e6;
        font-weight: 500;
    }

    .special-message .quote {
        font-size: 28px;
        margin-top: 10px;
        color: #FFD700;
    }

    .music-note {
        background: rgba(255, 215, 0, 0.2);
        padding: 8px 15px;
        border-radius: 40px;
        font-size: 14px;
        display: inline-block;
        margin-bottom: 15px;
        color: #FFD700;
    }

    @media (max-width: 550px) {
        #countdown {
            font-size: 70px;
            letter-spacing: 4px;
        }
        .countdown-box {
            padding: 30px 35px;
        }
        h2 {
            font-size: 26px;
        }
        .special-message p {
            font-size: 18px;
        }
        .special-message .quote {
            font-size: 22px;
        }
    }
</style>
</head>
<body>

<!-- خلفية كونفيتي متحركة -->
<div class="confetti-bg" id="confettiBg"></div>

<!-- قلوب طايرة -->
<div class="floating-hearts" id="heartsContainer"></div>

<!-- العد التنازلي 10 ثواني -->
<div class="countdown-box" id="countdownWrapper">
    <div id="countdown">10</div>
    <div class="countdown-label">⏳ انتظر 10 ثواني فقط ⏳</div>
    <div class="wait-message">✨ حبيبتي ملاك في انتظارك ✨</div>
</div>

<!-- المحتوى اللي بيظهر بعد العداد -->
<div id="content">
    <div class="music-note">🎵❤️ حبيبتي ملاك لعمرو دياب شغالة دلوقتي ❤️🎵</div>
    <img src="IMG-20251201-WA0017.jpg" alt="حبيبتي ملاك" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1053/1053710.png'">
    <h2>💕 يا حبيبتي ملاك 💕</h2>
    
    <div class="special-message">
        <p>✨ كل سنة وأنتي أجمل حاجة في حياتي ✨</p>
        </p>أ💖</p>
        <p>🌸 وجودك في حياتي هو أحلى هدية 🌸</p>
        <div class="quote">"حبيبتي ملاك .. قمر جميل .. ده كلام جميل"</div>
        <p style="font-size:18px; margin-top:15px;">🫶 بحبك أكثر من أي حاجة في الدنيا 🫶</p>
    </div>
</div>

<!-- iframe خفي للأغنية -->
<iframe id="musicFrame" width="0" height="0" frameborder="0" allow="autoplay" style="display:none;"></iframe>

<script>
    // === خلفية الكونفيتي الملونة ===
    function createConfetti() {
        const container = document.getElementById('confettiBg');
        if(!container) return;
        
        const colors = ['#FF69B4', '#FFD700', '#FFA500', '#00CED1', '#FF4500', '#9400D3', '#32CD32', '#FF1493', '#1E90FF', '#FF6347'];
        
        function addConfetti() {
            const conf = document.createElement('div');
            conf.classList.add('confetti');
            const size = Math.floor(Math.random() * 12) + 6;
            conf.style.width = size + 'px';
            conf.style.height = size + 'px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
            conf.style.left = Math.random() * 100 + '%';
            const duration = Math.random() * 3 + 2;
            conf.style.animationDuration = duration + 's';
            conf.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(conf);
            
            setTimeout(() => {
                conf.remove();
            }, duration * 1000);
        }
        
        setInterval(() => {
            for(let i = 0; i < 8; i++) {
                addConfetti();
            }
        }, 300);
    }
    createConfetti();
    
    // === قلوب متحركة في الخلفية ===
    function createFloatingHearts() {
        const container = document.getElementById('heartsContainer');
        if(!container) return;
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['❤️', '💖', '💗', '💓', '🌸', '🌹', '💕', '💘', '✨', '🫶', '💋', '🌟', '🎀', '💝', '🌺'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            const size = Math.floor(Math.random() * 32) + 20;
            heart.style.fontSize = size + 'px';
            heart.style.left = Math.random() * 100 + '%';
            const duration = Math.random() * 7 + 5;
            heart.style.animationDuration = duration + 's';
            heart.style.animationDelay = Math.random() * 3 + 's';
            heart.style.opacity = Math.random() * 0.7 + 0.3;
            container.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }, 600);
    }
    createFloatingHearts();
    
    // === العد التنازلي من 10 ثواني ===
    let countdownSeconds = 10;
    let isRevealed = false;
    let musicPlayed = false;
    
    const countdownEl = document.getElementById('countdown');
    const wrapper = document.getElementById('countdownWrapper');
    const contentDiv = document.getElementById('content');
    
    function updateCountdown() {
        if(isRevealed) return;
        
        if(countdownSeconds <= 0) {
            isRevealed = true;
            
            if(wrapper && contentDiv) {
                wrapper.style.display = 'none';
                contentDiv.style.display = 'block';
            }
            
            if(!musicPlayed) {
                playMusicAutomatically();
                musicPlayed = true;
            }
            return;
        }
        
        if(countdownEl) {
            countdownEl.innerHTML = countdownSeconds;
        }
        countdownSeconds--;
    }
    
    // === تشغيل أغنية "حبيبتي ملاك" لعمرو دياب ===
    function playMusicAutomatically() {
        const musicFrame = document.getElementById('musicFrame');
        if(!musicFrame) return;
        
        // رابط أغنية "حبيبتي ملاك" لعمرو دياب - رابط صحيح يعمل
        const videoId = "8t9h8YWG_00";
        musicFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&controls=0&disablekb=1&modestbranding=1&rel=0`;
        
        // إشعار ظهور الأغنية
        const toast = document.createElement('div');
        toast.innerHTML = '🎶❤️ حبيبتي ملاك .. عمرو دياب شغالة دلوقتي ❤️🎶';
        toast.style.position = 'fixed';
        toast.style.bottom = '30px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = 'rgba(0,0,0,0.8)';
        toast.style.backdropFilter = 'blur(12px)';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '60px';
        toast.style.color = '#FFD700';
        toast.style.fontSize = '16px';
        toast.style.zIndex = '9999';
        toast.style.fontWeight = 'bold';
        toast.style.border = '1px solid #FF69B4';
        toast.style.whiteSpace = 'nowrap';
        toast.style.fontFamily = 'Arial';
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 1000);
        }, 4500);
    }
    
    // بدء العد التنازلي
    const timer = setInterval(() => {
        updateCountdown();
        if(isRevealed) {
            clearInterval(timer);
        }
    }, 1000);
    
    // لو الصفحة اتحملت بعد الوقت خلاص
    window.addEventListener('load', function() {
        if(countdownSeconds <= 0 && !isRevealed) {
            updateCountdown();
        }
    });
</script>

</body>
</html>
