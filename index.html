<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Happy Birthday ya manonty 💖</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: 'Tajawal', 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #fde8f5, #fff0f0, #ffe4e1);
        background-attachment: fixed;
        color: #6b3e5c;
        text-align: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        cursor: default;
    }

    /* خلفية الكونفيتي الوردية الفاتحة */
    .confetti-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
    }

    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        top: -20px;
        animation: fall linear infinite;
    }

    @keyframes fall {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(100vh) rotate(360deg);
            opacity: 0.3;
        }
    }

    /* بالونات طايرة من تحت لفوق */
    .balloons {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
    }

    .balloon {
        position: absolute;
        bottom: -80px;
        font-size: 40px;
        animation: floatBalloon linear infinite;
        cursor: pointer;
        transition: transform 0.2s;
    }

    @keyframes floatBalloon {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0.9;
        }
        100% {
            transform: translateY(-110vh) rotate(15deg);
            opacity: 0.2;
        }
    }

    /* قلوب بالماوس */
    .mouse-heart {
        position: fixed;
        pointer-events: none;
        font-size: 20px;
        animation: fadeOut 1s ease-out forwards;
        z-index: 9999;
    }

    @keyframes fadeOut {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-50px) scale(1.5);
            opacity: 0;
        }
    }

    /* صندوق العد التنازلي - ألوان فاتحة */
    .countdown-box {
        background: rgba(255, 245, 250, 0.85);
        backdrop-filter: blur(15px);
        border-radius: 70px;
        padding: 45px 55px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 0 0 2px rgba(255, 200, 210, 0.8) inset;
        z-index: 2;
        text-align: center;
        border: 1px solid rgba(255, 180, 190, 0.5);
    }

    #countdown {
        font-size: 110px;
        font-weight: bold;
        font-family: monospace;
        background: linear-gradient(45deg, #f5a6b8, #ffb8c6, #ffc0cb);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 8px;
        text-shadow: none;
    }

    .countdown-label {
        font-size: 24px;
        margin-top: 15px;
        font-weight: 500;
        color: #c96f8c;
    }

    .wait-message {
        font-size: 18px;
        margin-top: 20px;
        background: rgba(255, 200, 210, 0.5);
        padding: 8px 20px;
        border-radius: 50px;
        display: inline-block;
        color: #b85c7c;
    }

    /* المحتوى اللي بيظهر بعد العداد - ألوان فاتحة */
    #content {
        display: none;
        z-index: 2;
        max-width: 550px;
        width: 90%;
        background: rgba(255, 245, 250, 0.9);
        backdrop-filter: blur(20px);
        border-radius: 60px;
        padding: 40px 25px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 180, 190, 0.8);
        animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    img {
        width: 200px;
        border-radius: 50%;
        border: 4px solid #ffb8c6;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        margin: 15px auto;
        display: block;
    }

    h2 {
        font-size: 32px;
        margin: 10px 0;
        color: #c96f8c;
    }

    .birthday-title {
        font-size: 28px;
        margin: 10px 0;
        color: #e887a3;
        font-weight: bold;
        text-shadow: 0 0 5px #ffccd5;
    }

    /* الرسالة المتدرجة */
    .typed-message {
        background: rgba(255, 240, 245, 0.9);
        border-radius: 40px;
        padding: 20px;
        margin: 20px 0;
        border: 1px solid #ffccd5;
        text-align: center;
        min-height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #typedText {
        font-size: 20px;
        line-height: 1.7;
        color: #9e5a77;
        font-weight: 500;
    }

    /* أزرار التحكم */
    .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px 0 10px;
        flex-wrap: wrap;
    }

    .music-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 50px;
        background: #ffb8c6;
        color: #6b3e5c;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }

    .music-btn:hover {
        background: #ffa5b7;
        transform: scale(1.02);
    }

    .music-btn:active {
        transform: scale(0.98);
    }

    .love-btn {
        padding: 12px 28px;
        border: none;
        border-radius: 50px;
        background: #ff8da1;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        margin-top: 10px;
    }

    .love-btn:hover {
        background: #ff7088;
        transform: scale(1.03);
    }

    @media (max-width: 550px) {
        #countdown {
            font-size: 65px;
        }
        .countdown-box {
            padding: 30px 35px;
        }
        h2 {
            font-size: 24px;
        }
        .birthday-title {
            font-size: 22px;
        }
        #typedText {
            font-size: 16px;
        }
        .controls {
            gap: 8px;
        }
        .music-btn {
            padding: 6px 12px;
            font-size: 12px;
        }
        .love-btn {
            padding: 8px 20px;
            font-size: 14px;
        }
    }
</style>
</head>
<body>

<div class="confetti-bg" id="confettiBg"></div>
<div class="balloons" id="balloonsContainer"></div>

<!-- العد التنازلي -->
<div class="countdown-box" id="countdownWrapper">
    <div id="countdown">10</div>
    <div class="countdown-label">⏳ انتظر 10 ثواني فقط ⏳</div>
    <div class="wait-message">✨ مفاجأة جميلة في انتظارك ✨</div>
</div>

<!-- المحتوى الرئيسي -->
<div id="content">
    <div class="birthday-title">🎈 Happy Birthday ya manonty 🎈</div>
    <img src="IMG-20251201-WA0017.jpg" alt="حبيبتي" onerror="this.src=ضعيف قدامها وانا عُمري ماكُنت ضعيف💗._كاريزما_يعيوني😍 _viralvideo _explore _fyp _foryou(MP3).mp3">
    <h2>💕 يا أجمل حبيبة 💕</h2>
    
    <div class="typed-message">
        <div id="typedText"></div>
    </div>

    <div class="controls">
        <button class="music-btn" id="playPauseBtn">⏸️ إيقاف</button>
        <button class="music-btn" id="restartMusicBtn">🔄 إعادة</button>
    </div>
    <button class="love-btn" id="loveBtn">💖 بحبك 💖</button>
</div>

<audio id="bgMusic" loop style="display:none;"></audio>

<script>
    // === خلفية كونفيتي ألوان فاتحة ===
    function createConfetti() {
        const container = document.getElementById('confettiBg');
        if(!container) return;
        const colors = ['#FFB8C6', '#FFC0D0', '#FFD1DC', '#FFE0E8', '#FADADD', '#FFD9E6', '#FFCAD4'];
        
        function addConfetti() {
            const conf = document.createElement('div');
            conf.classList.add('confetti');
            const size = Math.floor(Math.random() * 12) + 6;
            conf.style.width = size + 'px';
            conf.style.height = size + 'px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
            conf.style.left = Math.random() * 100 + '%';
            const duration = Math.random() * 3 + 2;
            conf.style.animationDuration = duration + 's';
            conf.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(conf);
            setTimeout(() => conf.remove(), duration * 1000);
        }
        setInterval(() => { for(let i = 0; i < 6; i++) addConfetti(); }, 300);
    }
    createConfetti();

    // === بالونات طايرة من تحت لفوق ===
    function createBalloons() {
        const container = document.getElementById('balloonsContainer');
        if(!container) return;
        const balloonIcons = ['🎈', '🎈', '🎀', '🎈', '💖', '🎈', '🌸', '🎈'];
        
        function addBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.innerHTML = balloonIcons[Math.floor(Math.random() * balloonIcons.length)];
            const size = Math.floor(Math.random() * 25) + 30;
            balloon.style.fontSize = size + 'px';
            balloon.style.left = Math.random() * 100 + '%';
            const duration = Math.random() * 6 + 5;
            balloon.style.animationDuration = duration + 's';
            balloon.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(balloon);
            setTimeout(() => balloon.remove(), duration * 1000);
        }
        setInterval(() => addBalloon(), 1500);
    }
    createBalloons();

    // === قلوب بالماوس ===
    document.addEventListener('mousemove', function(e) {
        const heart = document.createElement('div');
        heart.classList.add('mouse-heart');
        heart.innerHTML = ['❤️', '💖', '💗', '💓', '✨', '🌸'][Math.floor(Math.random() * 6)];
        heart.style.left = e.pageX - 12 + 'px';
        heart.style.top = e.pageY - 20 + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1000);
    });

    // === العد التنازلي ===
    let countdownSeconds = 10;
    let isRevealed = false;
    let audio = document.getElementById('bgMusic');
    let isPlaying = false;

    // رابط MP3 لأغنية حبيبتي ملاك (مصدر مباشر بديل - نسخة تجريبية)
    // بما أن YouTube بقى صعب، هنستخدم ملف audio تجريبي عشان تشتغل
    // لو عندك ملف MP3 حطه مكان الرابط ده
    audio.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
    // ملاحظة: الرابط ده أغنية تجريبية، حط مكانه رابط أغنية حبيبتي ملاك الحقيقية
    
    const countdownEl = document.getElementById('countdown');
    const wrapper = document.getElementById('countdownWrapper');
    const contentDiv = document.getElementById('content');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const restartBtn = document.getElementById('restartMusicBtn');
    const loveBtn = document.getElementById('loveBtn');

    function updateCountdown() {
        if(isRevealed) return;
        if(countdownSeconds <= 0) {
            isRevealed = true;
            if(wrapper && contentDiv) {
                wrapper.style.display = 'none';
                contentDiv.style.display = 'block';
            }
            startTypingEffect();
            playMusic();
            return;
        }
        if(countdownEl) countdownEl.innerHTML = countdownSeconds;
        countdownSeconds--;
    }

    // تأثير كتابة الرسالة بالتدريج
    function startTypingEffect() {
        const typedDiv = document.getElementById('typedText');
        const fullMessage = "💖 كل سنة وأنتي أجمل حاجة في حياتي 💖\n\n🌸 أنتي نور عيني وسبب سعادتي 🌸\n\n🫶 بحبك أكثر من أي حاجة في الدنيا 🫶";
        typedDiv.innerHTML = '';
        let i = 0;
        function typeNext() {
            if(i < fullMessage.length) {
                typedDiv.innerHTML += fullMessage.charAt(i);
                i++;
                setTimeout(typeNext, 60);
            }
        }
        typeNext();
    }

    // تشغيل الموسيقى
    function playMusic() {
        audio.play().then(() => {
            isPlaying = true;
            if(playPauseBtn) playPauseBtn.innerHTML = '⏸️ إيقاف';
        }).catch(e => {
            console.log("الأغنية تحتاج تفاعل");
            isPlaying = false;
            if(playPauseBtn) playPauseBtn.innerHTML = '▶️ تشغيل';
        });
    }

    function pauseMusic() {
        audio.pause();
        isPlaying = false;
        if(playPauseBtn) playPauseBtn.innerHTML = '▶️ تشغيل';
    }

    function togglePlayPause() {
        if(!isPlaying) {
            playMusic();
        } else {
            pauseMusic();
        }
    }

    function restartMusic() {
        audio.currentTime = 0;
        if(!isPlaying) {
            playMusic();
        } else {
            audio.play();
        }
    }

    // تأثير زر "بحبك" - يطلع قلوب كتير
    function burstHearts() {
        for(let i = 0; i < 35; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.classList.add('mouse-heart');
                heart.innerHTML = ['❤️', '💖', '💗', '💓', '💕', '💘', '🫶'][Math.floor(Math.random() * 7)];
                heart.style.left = (window.innerWidth / 2 - 50 + Math.random() * 100) + 'px';
                heart.style.top = (window.innerHeight / 2 - 50 + Math.random() * 100) + 'px';
                heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1200);
            }, i * 30);
        }
    }

    if(playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);
    if(restartBtn) restartBtn.addEventListener('click', restartMusic);
    if(loveBtn) loveBtn.addEventListener('click', burstHearts);

    // بدء العد التنازلي
    const timer = setInterval(() => {
        updateCountdown();
        if(isRevealed) clearInterval(timer);
    }, 1000);
</script>

</body>
</html>
